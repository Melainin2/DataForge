services:
  - type: web
    name: dataforge-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STT_MODE
        value: mock
      - key: LLM_MODE
        value: mock
      - key: FRONTEND_ORIGIN
        value: https://data-forge.vercel.app
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
